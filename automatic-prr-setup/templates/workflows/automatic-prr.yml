name: Automatic PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: automatic-prr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    # Never execute fork-controlled code on a persistent self-hosted runner.
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: [self-hosted, __RUNNER_LABEL__]
    timeout-minutes: 45

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPOSITORY: ${{ github.repository }}
      REVIEW_HARNESS: "__REVIEW_HARNESS__"
      REVIEW_MODEL: "__REVIEW_MODEL__"

    steps:
      - name: Check out exact PR revision
        # actions/checkout v7.0.1, pinned to an immutable full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify revision and attach PR branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:PR_SHA) {
            throw "HEAD does not match PR_SHA"
          }
          git switch -C $env:PR_BRANCH $env:PR_SHA
          if ($LASTEXITCODE -ne 0) { throw "git switch failed" }
          if ((git rev-parse HEAD).Trim() -ne $env:PR_SHA) {
            throw "HEAD does not match PR_SHA after switch"
          }

      - name: Skip when HEAD is the report commit
        id: loop-guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:PR_NUMBER -notmatch '^\d+$') { throw "invalid PR_NUMBER" }
          $expected = "chore(review): reports for #$($env:PR_NUMBER)"
          $message = (@(git log -1 --format=%B) -join "`n").Trim()
          $skip = 'false'
          if ($message -eq $expected) {
            $files = @(git diff-tree --no-commit-id --name-only -r HEAD | Where-Object { $_ })
            $prefix = "reviews/$($env:PR_NUMBER)/"
            $onlyReports = ($files.Count -gt 0) -and (
              -not ($files | Where-Object { $_ -notlike "$prefix*" })
            )
            if ($onlyReports) { $skip = 'true' }
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "skip=$skip`n")

      - name: Verify runner prerequisites
        # Checkout and comment posting use this repository's workflow token,
        # not the runner user's GitHub CLI account. Do not add a user-account check here.
        if: steps.loop-guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git --version
          if ($LASTEXITCODE -ne 0) { throw "git is unavailable" }

          switch ($env:REVIEW_HARNESS) {
            'claude' {
              claude --version
            }
            'opencode' {
              opencode --version
            }
            'cursor' {
              $cursorCommand = Get-Command cursor-agent -ErrorAction SilentlyContinue
              if (-not $cursorCommand) { throw "Cursor Agent CLI is unavailable" }
              & $cursorCommand.Source --version
            }
            'codex' {
              codex --version
            }
            default {
              throw "Unsupported review harness: $env:REVIEW_HARNESS"
            }
          }
          if ($LASTEXITCODE -ne 0) {
            throw "$env:REVIEW_HARNESS prerequisite check exited $LASTEXITCODE"
          }

      - name: Run automatic PR review
        if: steps.loop-guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prompt = Get-Content -Raw -LiteralPath .github/automatic-prr/pr-review.md
          $prompt = $prompt.Replace('{{PR_NUMBER}}', $env:PR_NUMBER)
          $prompt = $prompt.Replace('{{PR_SHA}}', $env:PR_SHA)
          $prompt = $prompt.Replace('{{BASE_SHA}}', $env:BASE_SHA)
          $prompt = $prompt.Replace('{{REPOSITORY}}', $env:REPOSITORY)
          $hasModel = -not [string]::IsNullOrWhiteSpace($env:REVIEW_MODEL)

          switch ($env:REVIEW_HARNESS) {
            'claude' {
              $arguments = @(
                '-p', $prompt,
                '--dangerously-skip-permissions',
                '--setting-sources', 'user',
                '--no-session-persistence'
              )
              if ($hasModel) { $arguments += @('--model', $env:REVIEW_MODEL) }
              & claude @arguments
            }
            'opencode' {
              $arguments = @('run', '--standalone', '--auto')
              if ($hasModel) { $arguments += @('--model', $env:REVIEW_MODEL) }
              $arguments += $prompt
              & opencode @arguments
            }
            'cursor' {
              $cursorCommand = Get-Command cursor-agent -ErrorAction SilentlyContinue
              if (-not $cursorCommand) {
                $candidate = Get-Command agent -ErrorAction SilentlyContinue
                if ($candidate) {
                  $helpText = (& $candidate.Source --help 2>&1 | Out-String)
                  if ($helpText -match 'Cursor Agent') { $cursorCommand = $candidate }
                }
              }
              if (-not $cursorCommand) { throw "Cursor Agent CLI is unavailable" }
              $arguments = @(
                '-p', '--force', '--trust',
                '--sandbox', 'disabled',
                '--approve-mcps'
              )
              if ($hasModel) { $arguments += @('--model', $env:REVIEW_MODEL) }
              $arguments += $prompt
              & $cursorCommand.Source @arguments
            }
            'codex' {
              $arguments = @(
                'exec', '--ephemeral',
                '--dangerously-bypass-approvals-and-sandbox'
              )
              if ($hasModel) { $arguments += @('--model', $env:REVIEW_MODEL) }
              $arguments += $prompt
              & codex @arguments
            }
            default {
              throw "Unsupported review harness: $env:REVIEW_HARNESS"
            }
          }
          if ($LASTEXITCODE -ne 0) {
            throw "$env:REVIEW_HARNESS review exited $LASTEXITCODE"
          }

      - name: Land reports and comment
        if: steps.loop-guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:PR_NUMBER -notmatch '^\d+$') { throw "invalid PR_NUMBER" }
          $token = $env:GITHUB_TOKEN
          if ([string]::IsNullOrWhiteSpace($token)) { throw "GITHUB_TOKEN is missing" }
          $prNumber = $env:PR_NUMBER
          $prBranch = $env:PR_BRANCH
          $repo = $env:REPOSITORY
          $reportDir = "reviews/$prNumber"
          $slackReport = Join-Path $reportDir "slack-report.md"
          $reviewReport = Join-Path $reportDir "review-report.md"
          $commitMessage = "chore(review): reports for #$prNumber"
          $prefix = "$reportDir/"

          if (-not (Test-Path -LiteralPath $slackReport)) { throw "slack-report.md missing" }
          $slackContent = Get-Content -Raw -LiteralPath $slackReport
          if ([string]::IsNullOrWhiteSpace($slackContent)) { throw "slack-report.md is empty" }
          if (-not (Test-Path -LiteralPath $reviewReport)) { throw "review-report.md missing" }

          $planned = New-Object System.Collections.Generic.List[string]
          foreach ($line in ((Get-Content -Raw -LiteralPath $reviewReport) -split '\r?\n')) {
            $trim = $line.Trim()
            if ($trim -notmatch '^\|') { continue }
            if ($trim -match '^\|\s*-+') { continue }
            if ($trim -match '(?i)\|\s*Phase\s*\|') { continue }
            $cells = @($trim.Trim('|') -split '\|' | ForEach-Object { $_.Trim() })
            if ($cells.Count -lt 3) { continue }
            $reportCell = $cells[2]
            if ($reportCell -match '\(([^)]+)\)') { $reportCell = $Matches[1] }
            $reportCell = $reportCell.Trim('`')
            $name = [System.IO.Path]::GetFileName(($reportCell -replace '\\', '/'))
            if ($name -notlike '*-review.md') { continue }
            if (-not $planned.Contains($name)) { [void]$planned.Add($name) }
          }
          $fullPr = Join-Path $reportDir 'full-pr-review.md'
          $otherPhases = @(Get-ChildItem -LiteralPath $reportDir -File -Filter '*-review.md' |
            Where-Object { $_.Name -ne 'full-pr-review.md' })
          if ($planned.Count -gt 0) {
            foreach ($name in $planned) {
              if (-not (Test-Path -LiteralPath (Join-Path $reportDir $name))) {
                throw "missing planned phase report $name"
              }
            }
          }
          elseif ((Test-Path -LiteralPath $fullPr) -and $otherPhases.Count -eq 0) {
            # Small path with no coverage table: full-pr-review.md is sufficient.
          }
          else {
            throw "review-report.md must list every planned phase report"
          }

          function ConvertTo-GitPath([string] $Path) {
            return ($Path -replace '\\', '/').Trim()
          }
          function Test-ReportPath([string] $Path) {
            $norm = ConvertTo-GitPath $Path
            return $norm.StartsWith($prefix)
          }

          git reset --quiet
          $changed = New-Object System.Collections.Generic.List[string]
          foreach ($line in @(git diff --name-only --diff-filter=ACDMRTUXB HEAD)) {
            if ($line) { [void]$changed.Add($line) }
          }
          foreach ($line in @(git ls-files --others --exclude-standard)) {
            if ($line) { [void]$changed.Add($line) }
          }
          foreach ($path in $changed) {
            if (Test-ReportPath $path) { continue }
            $tracked = @(git ls-files -- $path | Where-Object { $_ })
            if ($tracked.Count -gt 0) {
              git restore --source=HEAD --staged --worktree -- $path
              if ($LASTEXITCODE -ne 0) { throw "git restore failed for a non-report path" }
            }
            elseif (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }

          git add -- $reportDir
          if ($LASTEXITCODE -ne 0) { throw "git add failed" }
          $staged = @(git diff --cached --name-only | Where-Object { $_ })
          $unexpected = @($staged | Where-Object { -not (Test-ReportPath $_) })
          if ($unexpected.Count -gt 0) { throw "refusing to commit non-report paths" }

          $headMessage = (@(git log -1 --format=%B) -join "`n").Trim()
          $headFiles = @(git diff-tree --no-commit-id --name-only -r HEAD | Where-Object { $_ })
          $headOnlyReports = ($headFiles.Count -gt 0) -and (
            -not ($headFiles | Where-Object { $_ -notlike "$prefix*" })
          )
          $alreadyLanded = ($headMessage -eq $commitMessage) -and $headOnlyReports
          if ($staged.Count -gt 0) {
            & git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m $commitMessage
            if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
            $pushUrl = "https://x-access-token:${token}@github.com/${repo}.git"
            $pushOutput = & git push --porcelain $pushUrl "HEAD:refs/heads/$prBranch" 2>&1
            $pushCode = $LASTEXITCODE
            $safePush = ($pushOutput | Out-String) -replace [regex]::Escape($token), '***'
            if ($pushCode -ne 0) { throw "git push failed: $safePush" }
            $alreadyLanded = $false
          }

          if ($alreadyLanded -and $staged.Count -lt 1) {
            Write-Output "Reports already landed; skipping duplicate comment."
            return
          }

          if ($slackContent.Length -gt 65536) {
            throw "slack-report.md exceeds GitHub comment size limit"
          }
          gh --version
          if ($LASTEXITCODE -ne 0) { throw "gh is unavailable" }
          & gh pr comment $prNumber --repo $repo --body-file $slackReport
          if ($LASTEXITCODE -ne 0) { throw "gh pr comment failed" }
